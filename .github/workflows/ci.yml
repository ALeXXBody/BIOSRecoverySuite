name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Lint with ruff
        run: ruff check bios_recovery/ tests/ --output-format=concise

      - name: Test with pytest
        run: pytest tests/ -v

  build-windows:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm bios_recovery.spec

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Release assets on tag push
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path "dist/BIOSRecoverySuite/*" -DestinationPath "dist/BIOSRecoverySuite-portable-$version.zip" -Force
          gh release view $env:GITHUB_REF_NAME --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo ${{ github.repository }} `
              --title "$env:GITHUB_REF_NAME" --notes "" --latest
            if ($LASTEXITCODE -ne 0) { $LASTEXITCODE = 0 }
          }
          gh release upload $env:GITHUB_REF_NAME `
            "dist/BIOSRecoverySuite-Setup-*.exe" `
            "dist/BIOSRecoverySuite-portable-*.zip" `
            --repo ${{ github.repository }} --clobber
