name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Lint with ruff
        run: ruff check bios_recovery/ tests/ --output-format=concise

      - name: Test with pytest
        run: pytest tests/ -v

  release-init:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create the empty release so all build jobs can upload in parallel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "" --latest

  verify-tag:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import bios_recovery; print(bios_recovery.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match bios_recovery.__version__ ($version)."
            echo "Bump the version in bios_recovery/__init__.py before tagging."
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    needs: [release-init, verify-tag]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm bios_recovery.spec

      - name: Check the built app contains the patch registries
        shell: pwsh
        run: |
          $req = @("dist\BIOSRecoverySuite\_internal\bios_recovery\patches\ec_patches.json",
                   "dist\BIOSRecoverySuite\_internal\bios_recovery\patches\lenovo_patches.txt")
          foreach ($f in $req) {
            if (-not (Test-Path $f)) { Write-Error "missing from build: $f"; exit 1 }
          }

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import bios_recovery; print(bios_recovery.__version__)"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path "dist/BIOSRecoverySuite/*" -DestinationPath "dist/BIOSRecoverySuite-portable-$version.zip" -Force
          gh release upload "$env:GITHUB_REF_NAME" `
            "dist/BIOSRecoverySuite-Setup-*.exe" `
            "dist/BIOSRecoverySuite-portable-*.zip" `
            --repo ${{ github.repository }} --clobber

  build-linux:
    runs-on: ubuntu-latest
    needs: [release-init, verify-tag]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm bios_recovery.spec

      - name: Check the built app contains the patch registries
        run: |
          test -f "dist/BIOSRecoverySuite/_internal/bios_recovery/patches/ec_patches.json"
          test -f "dist/BIOSRecoverySuite/_internal/bios_recovery/patches/lenovo_patches.txt"

      - name: Package tarball
        run: |
          version=$(python -c "import bios_recovery; print(bios_recovery.__version__)")
          chmod +x dist/BIOSRecoverySuite/BIOSRecoverySuite
          tar -czf "dist/BIOSRecoverySuite-linux-x64-$version.tar.gz" -C dist BIOSRecoverySuite

      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/BIOSRecoverySuite-linux-x64-*.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    runs-on: macos-latest
    needs: [release-init, verify-tag]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm bios_recovery.spec

      - name: Check the built app contains the patch registries
        run: |
          test -f "dist/BIOSRecoverySuite.app/Contents/Resources/bios_recovery/patches/ec_patches.json" \
            || test -f "dist/BIOSRecoverySuite/_internal/bios_recovery/patches/ec_patches.json"

      - name: Package DMG
        run: |
          version=$(python -c "import bios_recovery; print(bios_recovery.__version__)")
          if [ -d "dist/BIOSRecoverySuite.app" ]; then
            src="dist/BIOSRecoverySuite.app"
          else
            src="dist"
          fi
          hdiutil create -volname "BIOSRecoverySuite" -srcfolder "$src" \
            -format UDBZ "dist/BIOSRecoverySuite-macos-arm64-$version.dmg"

      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/BIOSRecoverySuite-macos-arm64-*.dmg" --repo "$GITHUB_REPOSITORY" --clobber
